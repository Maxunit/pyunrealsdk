name: OAK2 DefPtr null-guard test build

on:
  push:
    branches:
      - test/gbx-defptr-null-guard-oak2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oak2:
    runs-on: windows-latest
    steps:
      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Checkout Python SDK and pinned dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout corrected unrealsdk
        uses: actions/checkout@v6
        with:
          repository: Maxunit/unrealsdk
          ref: 6e9ecfc46c610cf758b1b60195514b5e32514e53
          path: libs/unrealsdk
          submodules: recursive

      - name: Verify null guard before compilation
        shell: pwsh
        run: |
          $source = Get-Content libs/unrealsdk/src/unrealsdk/unreal/properties/zgbxdefptrproperty.cpp -Raw
          if (-not $source.Contains('if (prop_cls != nullptr && !value.type->inherits(prop_cls)) {')) {
            throw 'Expected FGbxDefPtr null guard missing'
          }

      - name: Configure OAK2 with debug symbols
        run: cmake . --preset clang-oak2-release -G Ninja

      - name: Build SDK DLLs
        run: cmake --build out/build/clang-oak2-release --target pyunrealsdk unrealsdk

      - name: Stage install
        run: cmake --install out/build/clang-oak2-release --prefix out/staging

      - name: Package DLLs, symbols and provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/artifact | Out-Null
          foreach ($name in @('unrealsdk.dll', 'pyunrealsdk.dll', 'unrealsdk.pdb', 'pyunrealsdk.pdb')) {
            $file = Join-Path out/staging $name
            if (-not (Test-Path $file)) { throw "Missing required build file: $name" }
            Copy-Item $file out/artifact/
          }
          @(
            'OAK2 experimental FGbxDefPtr null guard'
            "pyunrealsdk repository: ${{ github.repository }}"
            "pyunrealsdk commit: ${{ github.sha }}"
            'unrealsdk repository: Maxunit/unrealsdk'
            'unrealsdk commit: 6e9ecfc46c610cf758b1b60195514b5e32514e53'
            'Preset: clang-oak2-release (RelWithDebInfo, x64)'
            'Python build dependency: 3.14.3 (existing upstream preset)'
            'Scope: one null guard in ZGbxDefPtrProperty::set'
            'No in-game validation has been performed.'
            'Exit the game before replacement. Keep backups of both original DLLs.'
            'Replace both SDK DLLs together in their existing plugin directory.'
            'Retain both PDB files for crash analysis. Do not change Python or mod-manager files.'
            'This guard does not establish that NPC brain access or v103 is safe.'
          ) | Set-Content out/artifact/BUILD_INFO.txt -Encoding utf8
          Get-ChildItem out/artifact -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content out/artifact/SHA256SUMS.txt -Encoding utf8

      - name: Upload OAK2 SDK test download
        uses: actions/upload-artifact@v6
        with:
          name: OAK2-SDK-DefPtr-NullGuard
          path: out/artifact/
          if-no-files-found: error
          retention-days: 30
